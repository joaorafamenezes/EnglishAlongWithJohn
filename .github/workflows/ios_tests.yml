name: iOS & Swift Unit Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Run Unit Tests on macOS
    runs-on: macos-14  # Apple Silicon (M1/M2)

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Ativar Xcode 16 (Swift 6)
        run: |
          echo "Procurando versões do Xcode instaladas..."
          ls -d /Applications/Xcode* || true
          
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          fi

          echo "=== Versão Ativa do Swift ==="
          swift --version
          echo "=== Versão Ativa do Xcode ==="
          xcodebuild -version

      - name: Executar Suíte de Testes Automatizados (Swift Testing)
        run: swift test --verbose
