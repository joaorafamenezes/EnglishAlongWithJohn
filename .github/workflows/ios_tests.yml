name: iOS & Swift Unit Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Run Unit Tests and Build IPA
    runs-on: macos-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Ativar Xcode 16 (Swift 6)
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          fi

          echo "=== Versão Ativa do Xcode ==="
          xcodebuild -version

      - name: Obter ID do Simulador iOS Único
        id: sim
        run: |
          DEVICE_ID=$(xcrun simctl list devices 'iPhone' available | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -n 1)
          echo "Simulador UUID selecionado: $DEVICE_ID"
          echo "id=$DEVICE_ID" >> $GITHUB_OUTPUT

      - name: Executar Suíte de Testes no iOS Simulator
        run: |
          xcodebuild test \
            -scheme EnglishAlongWithJohn \
            -destination "id=${{ steps.sim.outputs.id }}"

      - name: Instalar XcodeGen e Gerar Projeto Xcode (.xcodeproj)
        run: |
          brew install xcodegen || true
          xcodegen generate

      - name: Compilar App (.app) para o Simulador iOS
        run: |
          xcodebuild build \
            -project EnglishAlongWithJohn.xcodeproj \
            -scheme EnglishAlongWithJohn \
            -destination "id=${{ steps.sim.outputs.id }}" \
            -configuration Debug \
            -derivedDataPath build

          echo "Preparando .app do simulador para artefato..."
          ls -la build/Build/Products/Debug-iphonesimulator/EnglishAlongWithJohn.app

      - name: Disponibilizar App para Download (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: EnglishAlongWithJohn-Simulator
          path: build/Build/Products/Debug-iphonesimulator/EnglishAlongWithJohn.app
          retention-days: 7

      - name: Compilar IPA para iPhone Físico (Dispositivo Real)
        run: |
          xcodebuild build \
            -project EnglishAlongWithJohn.xcodeproj \
            -scheme EnglishAlongWithJohn \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath build-device

          mkdir -p Payload
          cp -r build-device/Build/Products/Release-iphoneos/EnglishAlongWithJohn.app Payload/
          zip -r EnglishAlongWithJohn.ipa Payload

      - name: Disponibilizar IPA para Download (iPhone Físico)
        uses: actions/upload-artifact@v4
        with:
          name: EnglishAlongWithJohn-Device-IPA
          path: EnglishAlongWithJohn.ipa
          retention-days: 7

